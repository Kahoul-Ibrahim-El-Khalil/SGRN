name: CI

on:
  push:
    branches: [main, ci/bootstrap, datastore/hardening]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Build and Test Matrix (Release, ASan+UBSan, TSan) ──────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Release (Hardened)"
            mode: "release"
            sanitizer: ""
            check_sec: true
          - name: "ASan + UBSan"
            mode: "debug"
            sanitizer: "asan,ubsan"
            check_sec: false
          - name: "TSan"
            mode: "debug"
            sanitizer: "tsan"
            check_sec: false
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install system build dependencies and Xmake
        run: |
          sudo add-apt-repository -y ppa:xmake-io/xmake
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool python3 bison flex \
            libreadline-dev libncurses-dev jq checksec \
            libssl-dev zlib1g-dev libzstd-dev libsqlite3-dev \
            libc-ares-dev uuid-dev xmake

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Xmake package cache
        uses: actions/cache@v4
        with:
          path: ~/.xmake
          key: xmake-${{ runner.os }}-${{ hashFiles('deps-versions.lua', 'xmake/packages.lua', 'xmake/packages/*.lua') }}
          restore-keys: |
            xmake-${{ runner.os }}-

      - name: Configure SGRN (xmake)
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ matrix.sanitizer }}" ]; then
            EXTRA_ARGS="--sanitize=${{ matrix.sanitizer }}"
          fi
          xmake f -p linux -m "${{ matrix.mode }}" --tests=y --torch=n --pch=n --auto_codegen=n -y $EXTRA_ARGS

      - name: Build SGRN (web SPAs, embedded assets, C++ targets)
        run: xmake -j"$(nproc)"

      - name: Run unit tests
        run: xmake test -v

      - name: Verify Binary Hardening with checksec
        if: matrix.check_sec
        run: |
          BINARY=".build/linux/x86_64/release/sgrn_datastore"
          if [ -f "$BINARY" ]; then
            checksec --file="$BINARY" --format=cli
            checksec --file="$BINARY" --format=json | jq .
          fi

      - name: ASan deliberate out-of-bounds trap test
        if: matrix.sanitizer == 'asan,ubsan'
        run: |
          SCRATCH_TEST=".build/linux/x86_64/debug/asan_scratch_test"
          if [ -f "$SCRATCH_TEST" ]; then
            echo "Running benign test..."
            "$SCRATCH_TEST"
            echo "Triggering deliberate out-of-bounds read (expecting ASan error)..."
            set +e
            "$SCRATCH_TEST" --trigger-crash
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -eq 0 ]; then
              echo "ERROR: ASan failed to trap deliberate out-of-bounds read!"
              exit 1
            else
              echo "SUCCESS: ASan trapped out-of-bounds read with exit code $EXIT_CODE"
            fi
          fi

  # ── 2. Static Analysis (cppcheck) ────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install static analysis tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I sgrn/lib/core/include \
            -I sgrn/lib/utils/include \
            -I sgrn/lib/datastore/include \
            sgrn/lib/datastore/src/ 2>&1 | tee cppcheck_report.txt

  # ── 3. CycloneDX SBOM Generation ─────────────────────────────────────────────
  cyclonedx-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install syft / cyclonedx generator
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: Generate CycloneDX SBOM
        run: syft scan dir:. -o cyclonedx-json=sbom.cyclonedx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgrn-sbom-cyclonedx
          path: sbom.cyclonedx.json
