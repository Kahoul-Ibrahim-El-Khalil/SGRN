name: CI

on:
  push:
    branches: [main, ci/bootstrap]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRESET_DEPS: linux-deps-static
  PRESET_MAIN: linux-static-release
  CPM_CACHE_DIR: ${{ github.workspace }}/.cpm-cache

jobs:
  linux:
    name: Linux CI
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: sgrn/web/gateway
        run: bun install --frozen-lockfile

      - name: Restore tool cache
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: |
            .prefix
            .cpm-cache
          key: linux-ci-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'micromamba/SGRN.yml', 'cmake/**', 'sgrn/CMakeLists.txt') }}
          restore-keys: |
            linux-ci-${{ runner.os }}-

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: micromamba/SGRN.yml
          environment-name: SGRN
          init-shell: bash
          cache-environment: true
          cache-downloads: true
          post-cleanup: environment

      - name: Set compiler paths
        run: |
          echo "CC_BIN=$CONDA_PREFIX/bin/clang" >> "$GITHUB_ENV"
          echo "CXX_BIN=$CONDA_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "PATH_TO_NINJA=$CONDA_PREFIX/bin/ninja" >> "$GITHUB_ENV"

      - name: Configure dependencies
        run: |
          cmake --preset "$PRESET_DEPS" \
            -DCMAKE_C_COMPILER="$CC_BIN" \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DCPM_SOURCE_CACHE="$CPM_CACHE_DIR" \
            -DUSE_PCH=OFF

      - name: Build dependencies
        run: |
          cmake --build --preset "$PRESET_DEPS" -j"$(nproc)"

      - name: Configure SGRN
        run: |
          cmake --preset "$PRESET_MAIN" \
            -DCMAKE_C_COMPILER="$CC_BIN" \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPM_SOURCE_CACHE="$CPM_CACHE_DIR" \
            -DUSE_PCH=OFF

      - name: Build SGRN
        run: |
          cmake --build --preset "$PRESET_MAIN" -j"$(nproc)"
          ccache --show-stats

      - name: Run C++ tests
        run: |
          ctest \
            --test-dir ".build/$PRESET_MAIN" \
            --output-on-failure \
            --timeout 120 \
            -j2
