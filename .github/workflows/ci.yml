name: CI

on:
  push:
    branches: [main, ci/bootstrap]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRESET_DEPS: linux-deps-static
  PRESET_MAIN: linux-static-release
  CPM_CACHE_DIR: ${{ github.workspace }}/.cpm-cache

jobs:
  # ── 0. Change classification ──────────────────────────────────────────────
  # Cheap path filter that decides which of the real jobs run. Everything
  # still runs when pushed to main (safety net) — path gating is primarily
  # for pull requests.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}      # anything that affects C++ build inputs
      cpp: ${{ steps.filter.outputs.cpp }}          # C++ sources/headers/tests
      ci: ${{ steps.filter.outputs.ci }}            # workflow / CI tooling
      python: ${{ steps.filter.outputs.python }}    # python package + research experiments
      ts: ${{ steps.filter.outputs.ts }}            # typescript / web assets
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Classify changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build:
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'deps/**'
              - 'micromamba/**'
              - 'sgrn/**'
              - 'tests/**'
              - 'docs/**'
            cpp:
              - 'sgrn/**/*.cpp'
              - 'sgrn/**/*.cc'
              - 'sgrn/**/*.hpp'
              - 'sgrn/**/*.h'
              - 'sgrn/**/CMakeLists.txt'
              - 'cmake/**'
              - 'tests/**'
            ci:
              - '.github/**'
            python:
              - 'sgrn/python/**'
              - 'tests/**'
              - 'experiments/**'
            ts:
              - 'sgrn/typescript/**'
              - 'sgrn/web/**'
              - 'tests/ts/**'

  # ── 1. Fast quality gate (formatting only — seconds, not minutes) ────────
  quality:
    name: C++ style (clang-format)
    needs: changes
    if: needs.changes.outputs.cpp == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: we diff against the base SHA below, and the repo pack
      # is only a few MiB, so a shallow clone is not worth the edge cases.
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up micromamba (SGRN environment)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: micromamba/SGRN.yml
          environment-name: SGRN
          cache-environment: true
          cache-downloads: true
          init-shell: bash
          post-cleanup: environment

      - name: clang-format check (touched files only)
        shell: bash -el {0}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # New branch / first push: github.event.before is the zero SHA and
          # the commit may not exist — fall back to checking everything.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Base commit '${BASE:-<empty>}' unavailable — checking all tracked C++ sources."
            FILES=$(git ls-files -- '*.cpp' '*.cc' '*.hpp' '*.h')
          else
            FILES=$(git diff --name-only "$BASE" -- '*.cpp' '*.cc' '*.hpp' '*.h' | tr -d '\r' | grep -v '^$' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "No C++ sources touched — nothing to check."
            exit 0
          fi
          # Only keep files that actually exist at HEAD (handles renames/deletes).
          EXISTING=""
          for f in $FILES; do
            [ -f "$f" ] && EXISTING="$EXISTING $f"
          done
          if [ -z "$EXISTING" ]; then
            echo "No surviving C++ files to check."
            exit 0
          fi
          clang-format --dry-run --Werror $EXISTING

  # ── 2. Dependency build & staging (.prefix) ───────────────────────────────
  deps:
    name: Phase 1 — dependencies (.prefix)
    needs: changes
    if: >
      needs.changes.outputs.build == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    outputs:
      cache_key: ${{ steps.deps-cache.outputs.cache-primary-key }}
    steps:
      # ── 2a. Free disk space ────────────────────────────────────────────────
      # The conda env is ~2 GB; deps prefix 3-4 GB; build tree 3-5 GB.
      # Reclaim the largest pre-installed blobs first.
      - name: Free disk space
        shell: bash
        run: |
          echo "=== Disk before pruning ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /usr/share/swift \
            /usr/local/.ghcup
          echo "=== Disk after pruning ==="
          df -h /
      # ── 2b. Micromamba / conda environment ────────────────────────────────
      # setup-micromamba activates the env in every subsequent bash -el step.
      - name: Set up micromamba (SGRN environment)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: micromamba/SGRN.yml
          environment-name: SGRN
          cache-environment: true
          cache-downloads: true
          init-shell: bash
          post-cleanup: environment

      # ── 2c. Ninja & compiler paths ────────────────────────────────────────
      - name: Export build environment
        run: |
          echo "PATH_TO_NINJA=$CONDA_PREFIX/bin/ninja" >> "$GITHUB_ENV"
          echo "CC_BIN=$CONDA_PREFIX/bin/clang"        >> "$GITHUB_ENV"
          echo "CXX_BIN=$CONDA_PREFIX/bin/clang++"     >> "$GITHUB_ENV"

      # ── 2d. Restore/save dependency cache ────────────────────────────────
      # Split restore/save so we can save even when the rest of the job is skipped.
      - name: Restore dependency cache (.prefix + CPM sources)
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .prefix
            .cpm-cache
          key: deps-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'cmake/**', 'deps/**', 'micromamba/SGRN.yml') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # ── 2e. Configure & build dependencies ───────────────────────────────
      - name: Configure dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake --preset "$PRESET_DEPS" \
            -DCMAKE_C_COMPILER="$CC_BIN" \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DCPM_SOURCE_CACHE="$CPM_CACHE_DIR" \
            -DUSE_PCH=OFF

      # The linux-deps-static BUILD preset has "targets": ["install"], so
      # cmake --build --preset linux-deps-static runs compile + install in one shot.
      - name: Build & stage dependencies (installs to .prefix/linux-static)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake --build --preset "$PRESET_DEPS" -j"$(nproc)"
          echo "=== Disk after Phase 1 ==="
          df -h /

      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .prefix
            .cpm-cache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

  # ── 3. Build + tests (Phase 2; every downstream test tier lives here) ────
  build-test:
    name: Phase 2 — build & test
    needs: [changes, deps]
    if: >
      always() &&
      (needs.changes.outputs.build == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # ── 3a. Micromamba environment ─────────────────────────────────────
      - name: Set up micromamba (SGRN environment)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: micromamba/SGRN.yml
          environment-name: SGRN
          cache-environment: true
          cache-downloads: true
          init-shell: bash
          post-cleanup: environment

      # ── 3b. Build-environment exports ─────────────────────────────────
      - name: Export build environment
        run: |
          echo "PATH_TO_NINJA=$CONDA_PREFIX/bin/ninja" >> "$GITHUB_ENV"
          echo "CC_BIN=$CONDA_PREFIX/bin/clang"        >> "$GITHUB_ENV"
          echo "CXX_BIN=$CONDA_PREFIX/bin/clang++"     >> "$GITHUB_ENV"

      # ── 3c. Web asset pre-build (bun + Vite) ───────────────────────────
      # sgrn/web/gateway/dist/ is gitignored; CMake's custom command runs
      # `bun run build` at build time, but fails if dist/ doesn't already
      # exist. Pre-build here so the sentinel .build_done is present.
      - name: Set up Bun (for web asset builds)
        uses: oven-sh/setup-bun@v2

      - name: Build gateway web assets (Svelte + Vite)
        run: |
          (cd sgrn/typescript && bun install --frozen-lockfile 2>/dev/null || bun install)
          (cd sgrn/web/gateway && bun install --frozen-lockfile 2>/dev/null || bun install)
          (cd sgrn/web/gateway && bun run build)

      - name: Build datastore web assets (React + Vite)
        run: |
          (cd sgrn/web/datastore && bun install --frozen-lockfile 2>/dev/null || bun install)
          (cd sgrn/web/datastore && bun run build)

      # ── 3d. Restore dep cache produced by the deps job ──────────────────
      - name: Restore dependency cache (.prefix + CPM sources)
        uses: actions/cache/restore@v4
        with:
          path: |
            .prefix
            .cpm-cache
          key: deps-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'cmake/**', 'deps/**', 'micromamba/SGRN.yml') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # ── 3e. ccache ─────────────────────────────────────────────────────
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      # ── 3f. Phase 2 — configure & build SGRN ──────────────────────────
      - name: Configure SGRN
        run: |
          cmake --preset "$PRESET_MAIN" \
            -DCMAKE_C_COMPILER="$CC_BIN" \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPM_SOURCE_CACHE="$CPM_CACHE_DIR" \
            -DUSE_PCH=OFF

      - name: Build SGRN
        run: |
          cmake --build --preset "$PRESET_MAIN" -j"$(nproc)"
          ccache --show-stats
          echo "=== Disk after Phase 2 ==="
          df -h /

      # ── 3g. C++ unit tests (ctest) ────────────────────────────────────
      # Tests excluded and reasons:
      #
      #   opcua_discovery_test      - Uses gateway_fixture.hpp to spawn gateway +
      #                               s7shell. S7 protocol listens on port 102, a
      #                               privileged port (<1024) on Linux; binding it
      #                               requires CAP_NET_BIND_SERVICE or root.
      #                               The test self-SKIPs when the gateway binary is
      #                               missing, but may fail with EACCES on the port
      #                               bind before the skip check. Excluded to avoid
      #                               non-deterministic failures on the runner.
      #
      #   opcua_enum_test           - Same reason (gateway_fixture.hpp + port 102).
      #
      #   modbus_registers_test     - Spawns gateway via gateway_fixture.hpp; the
      #                               Modbus listener default is port 502 (also
      #                               privileged). Self-SKIPs when binary missing.
      #
      #   s7_southbound_test        - Spawns gateway (gateway_fixture.hpp); S7 on
      #                               port 102. Self-SKIPs when binary missing.
      #
      #   binary_live_snapshot_test - Spawns gateway + IXWebSocket client; same
      #                               port-privilege concern. Excluded for consistency.
      #
      #   pg_auth_functions_test    - Needs a live PostgreSQL cluster. Self-SKIPs
      #                               (exit 0) when PGHOST unset and no initdb in
      #                               PATH, but excluded to keep output clean.
      #                               Re-enable when a PG service container is added.
      - name: C++ unit tests (ctest)
        run: |
          ctest \
            --test-dir ".build/$PRESET_MAIN" \
            --output-on-failure \
            --timeout 120 \
            -j2 \
            -E "opcua_discovery_test|opcua_enum_test|modbus_registers_test|s7_southbound_test|binary_live_snapshot_test|pg_auth_functions_test"

      # ── 3h. Python tests (non-blocking) ────────────────────────────────
      # gateway-arrays needs a live gateway; scl-validation needs the built
      # sclc binary (not always available). Kept non-blocking until the pip:
      # section of SGRN.yml is confirmed to install cleanly on the runner and
      # the offline tests (gateway-rest, scl-dtypes) are green.
      - name: Python tests (non-blocking)
        continue-on-error: true
        run: python3 tests/run_tests.py --kind python

      # ── 3i. TypeScript E2E tests (non-blocking) ────────────────────────
      # Spawns a live gateway+s7shell internally. The s7shell needs port 102
      # (privileged). Kept non-blocking until a sysctl/capability solution is
      # confirmed or the tests are refactored to use unprivileged ports.
      - name: TypeScript E2E tests (non-blocking)
        continue-on-error: true
        run: |
          (cd tests/ts && bun install --frozen-lockfile 2>/dev/null || bun install)
          python3 tests/run_tests.py --kind ts

      # ── 3j. Upload artifacts on failure ────────────────────────────────
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            .build/${{ env.PRESET_MAIN }}/Testing/Temporary/LastTest.log
            .build/${{ env.PRESET_MAIN }}/Testing/Temporary/LastTestsFailed.log
            /tmp/gateway-state-*
          if-no-files-found: ignore

  # ── 4. Aggregate status — required check target for branch protection ──
  ci:
    name: CI summary
    needs: [changes, quality, deps, build-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all consumer jobs succeeded (or were intentionally skipped)
        run: |
          echo "changes:   ${{ needs.changes.result }}"
          echo "quality:   ${{ needs.quality.result }}"
          echo "deps:      ${{ needs.deps.result }}"
          echo "build-test: ${{ needs.build-test.result }}"

          FAILED=0
          for r in \
            "changes ${{ needs.changes.result }}" \
            "quality ${{ needs.quality.result }}" \
            "deps ${{ needs.deps.result }}" \
            "build-test ${{ needs.build-test.result }}"; do
            name="${r%% *}"; result="${r##* }"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name failed with '$result'"; FAILED=1 ;;
            esac
          done
          exit $FAILED
