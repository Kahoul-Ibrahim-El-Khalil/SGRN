user ${SGRN_USER};
worker_processes auto;
pid ${SGRN_DATA_DIR}/var/run/nginx.pid;

include ${SGRN_DEPLOYMENT_ENV}/etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    types_hash_max_size 2048;
    server_tokens off;

    include ${SGRN_DEPLOYMENT_ENV}/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log ${SGRN_DATA_DIR}/var/log/nginx/sgrn_access.log;
    error_log  ${SGRN_DATA_DIR}/var/log/nginx/sgrn_error.log;

    # ── Rate limiting (per-client-IP first line of defence) ──────────────
    # Rejected requests answer 429, never 503. These are coarse DoS/flood
    # guards; precise per-account budgets (auth brute force, API quotas)
    # live in the applications themselves (datastore pre-routing advice,
    # gateway middleware), which see past NAT and know the caller.
    limit_req_status 429;
    limit_req_log_level warn;
    # Auth / signin: brute-force surface (mirrors the app's 5/min budget).
    limit_req_zone $binary_remote_addr zone=rl_auth:10m rate=5r/m;
    # General APIs (datastore /api/v1, gateway UI+API, WS handshakes —
    # limit_req only sees the handshake request, never WS frames).
    limit_req_zone $binary_remote_addr zone=rl_api:10m rate=30r/s;
    # Served pages / embedded assets (a page load is a handful of requests).
    limit_req_zone $binary_remote_addr zone=rl_page:10m rate=10r/s;
    # Garage S3 API (no console; admin is the `garage` CLI on :3903).
    limit_req_zone $binary_remote_addr zone=rl_s3:10m rate=20r/s;

    # Gzip Compression
    gzip on;

    # Include Virtual Hosts
    include ${SGRN_DEPLOYMENT_ENV}/etc/nginx/conf.d/*.conf;
    include ${SGRN_DEPLOYMENT_ENV}/etc/nginx/sites-enabled/*;
}
