# ==============================================================================
# SGRN Nginx Configuration
#
# Role: TLS terminator + reverse proxy only.
#
# Simplified routing:
# - /datastore/ -> Drogon HTTP server on port 5000
# - /gateway/   -> S7 Gateway REST on port 8000
# - /gateway/ws -> S7 Gateway WebSocket (/ws on the same port 8000 listener)
# - /minio/     -> Garage S3 API on port 3900 (path kept for compatibility)
# ==============================================================================

# Redirect all plain HTTP to HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host:443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate      ${SGRN_DATA_DIR}/certs/server.crt;
    ssl_certificate_key  ${SGRN_DATA_DIR}/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Global proxy settings
    client_max_body_size 1G;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ──────────────────────────────────────────────────────────────────────────
    # Upstream: sgrn_datastore (Drogon, port 5000)
    # Serves the embedded UI and API
    # ──────────────────────────────────────────────────────────────────────────
    location /datastore/ {
        limit_req zone=rl_page burst=20 nodelay;
        rewrite ^/datastore/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Cookie            $http_cookie;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
    }

    location = /datastore {
        return 301 /datastore/;
    }

    # Datastore auth (signin / signout / password): brute-force surface.
    # Longer prefix wins over /api/v1/ below, so these requests land here.
    location /api/v1/auth/ {
        limit_req zone=rl_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Cookie            $http_cookie;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
    }

    # Datastore API
    location /api/v1/ {
        limit_req zone=rl_api burst=60 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Cookie            $http_cookie;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
    }

    # Frontend Assets
    location /assets/ {
        limit_req zone=rl_page burst=20 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # S7 Gateway (port 8000 REST/assets + WebSocket at /ws — one listener)
    # ──────────────────────────────────────────────────────────────────────────
    location /gateway/ws {
        # Only the WS handshake (a plain HTTP request) is limited here;
        # frames on the upgraded connection are unaffected.
        limit_req zone=rl_api burst=60 nodelay;
        rewrite ^/gateway/ws$ /ws break;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              127.0.0.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /gateway;
    }

    location /gateway/ {
        limit_req zone=rl_api burst=60 nodelay;
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /gateway;
    }

    location = /gateway {
        return 301 /gateway/;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # Garage S3 API (port 3900). Path kept as /minio/ for compatibility.
    # (Garage has no web console: the old /minio-console/ block is gone;
    #  cluster admin is the `garage` CLI against :3903.)
    # ──────────────────────────────────────────────────────────────────────────
    location /minio/ {
        limit_req zone=rl_s3 burst=40 nodelay;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        client_max_body_size 0;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # Logs
    # ──────────────────────────────────────────────────────────────────────────
    access_log ${SGRN_DATA_DIR}/var/log/nginx/sgrn_access.log;
    error_log  ${SGRN_DATA_DIR}/var/log/nginx/sgrn_error.log;
}
