# ==============================================================================
# SGRN Nginx Configuration
#
# Role: TLS terminator + reverse proxy only.
#
# Simplified routing:
# - /datastore/ -> Drogon HTTP server on port 5000
# - /gateway/   -> S7 Gateway REST on port 8000
# - /gateway/ws -> S7 Gateway WS on port 8001
# - /minio/     -> MinIO S3 API on port 9000
# - /minio-console/ -> MinIO Console on port 9001
# ==============================================================================

# Redirect all plain HTTP to HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host:443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate      ${SGRN_DATA_DIR}/certs/server.crt;
    ssl_certificate_key  ${SGRN_DATA_DIR}/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Global proxy settings
    client_max_body_size 1G;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ──────────────────────────────────────────────────────────────────────────
    # Upstream: sgrn_datastore (Drogon, port 5000)
    # Serves the embedded UI and API
    # ──────────────────────────────────────────────────────────────────────────
    location /datastore/ {
        rewrite ^/datastore/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Cookie            $http_cookie;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
    }

    location = /datastore {
        return 301 /datastore/;
    }

    # Datastore API
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Cookie            $http_cookie;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
    }

    # Frontend Assets
    location /assets/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # S7 Gateway (port 8000 REST/assets, port 8001 WebSocket)
    # ──────────────────────────────────────────────────────────────────────────
    location /gateway/ws {
        rewrite ^/gateway/ws$ / break;
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              127.0.0.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /gateway;
    }

    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /gateway;
    }

    location = /gateway {
        return 301 /gateway/;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # MinIO S3 API (port 9000)
    # ──────────────────────────────────────────────────────────────────────────
    location /minio/ {
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        client_max_body_size 0;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # MinIO Console (port 9001)
    # ──────────────────────────────────────────────────────────────────────────
    location /minio-console/ {
        rewrite ^/minio-console/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        client_max_body_size 0;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # Logs
    # ──────────────────────────────────────────────────────────────────────────
    access_log ${SGRN_DATA_DIR}/var/log/nginx/sgrn_access.log;
    error_log  ${SGRN_DATA_DIR}/var/log/nginx/sgrn_error.log;
}
