[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sgrn"
version = "0.2.0"
description = "Python bindings for the SGRN Gateway northbound API (REST + WebSocket telemetry + NumPy)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SGRN" }]
keywords = ["sgrn", "gateway", "plc", "telemetry", "iot", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "websockets>=12.0",
]

[project.urls]
Repository = "https://example.invalid/sgrn"

[tool.setuptools.packages.find]
include = ["sgrn*"]

[tool.setuptools.package-data]
sgrn = ["py.typed"]
